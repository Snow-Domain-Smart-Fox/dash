<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Amazing Luogu 面板" />
    <title>Amazing Luogu</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --bg-strong: #eef3ff;
        --card: #ffffff;
        --card-alt: #f8fafc;
        --text: #1f2937;
        --muted: #667085;
        --border: #e5e7eb;
        --primary: #2563eb;
        --primary-soft: rgba(37, 99, 235, 0.08);
        --success: #16a34a;
        --warning: #d97706;
        --danger: #dc2626;
        --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        --radius: 16px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(180deg, var(--bg-strong) 0%, var(--bg) 260px);
        color: var(--text);
      }

      a { color: inherit; text-decoration: none; }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.9);
        border-bottom: 1px solid var(--border);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 72px;
        gap: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 1.1rem;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
        color: white;
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28);
      }

      .hero {
        padding: 44px 0 18px;
      }

      .hero-card {
        background: linear-gradient(135deg, rgba(37,99,235,0.06), rgba(96,165,250,0.03));
        border: 1px solid rgba(37,99,235,0.08);
        border-radius: 24px;
        padding: 28px 24px;
        box-shadow: var(--shadow);
      }

      .hero-title {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.1;
      }

      .hero-sub {
        color: var(--muted);
        margin: 12px 0 0;
        font-size: 1.05rem;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }

      .search-box,
      .filter-box {
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.8);
        border-radius: 12px;
        min-height: 44px;
        padding: 0 14px;
        font-size: 0.96rem;
      }

      .search-box {
        flex: 1 1 260px;
      }

      .filter-box {
        min-width: 160px;
      }

      .main {
        padding: 18px 0 56px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 18px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.04);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
        border-color: rgba(37, 99, 235, 0.25);
      }

      .card-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      .icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: var(--primary-soft);
        display: grid;
        place-items: center;
        color: var(--primary);
        font-size: 1.2rem;
        flex-shrink: 0;
      }

      .icon svg {
        width: 22px;
        height: 22px;
        display: block;
      }

      .card-title {
        margin: 0;
        font-size: 1.08rem;
        font-weight: 700;
      }

      .card-desc {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 16px;
        min-height: 52px;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 5px 10px;
        background: var(--card-alt);
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.72rem;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 10px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .meta-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .status.active {
        background: rgba(22, 163, 74, 0.1);
        color: var(--success);
      }

      .status.maintenance {
        background: rgba(217, 119, 6, 0.1);
        color: var(--warning);
      }

      .status.inactive,
      .status.deprecated {
        background: rgba(148, 163, 184, 0.12);
        color: #475569;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        background: currentColor;
      }

      .empty {
        background: var(--card);
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        color: var(--muted);
        text-align: center;
        padding: 54px 20px;
      }

      @media (max-width: 768px) {
        .topbar-inner {
          flex-direction: column;
          justify-content: center;
          padding: 14px 0;
        }

        .toolbar {
          flex-direction: column;
        }

        .search-box, .filter-box {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="brand">
          <div class="brand-mark">A</div>
          <span>Amazing Luogu</span>
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="container">
        <div class="hero-card">
          <h1 class="hero-title">服务导航</h1>
          <p class="hero-sub">快速访问各类工具、API 与社区服务。</p>

          <div class="toolbar">
            <input id="searchInput" class="search-box" type="text" placeholder="搜索服务名称 / 标签 / 描述..." />
            <select id="categoryFilter" class="filter-box">
              <option value="all">全部分类</option>
              <option value="工具">工具</option>
              <option value="API">API</option>
              <option value="社区">社区</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <main class="main">
      <div class="container">
        <div id="serviceGrid" class="grid"></div>
      </div>
    </main>

    <script>
      const serviceGrid = document.getElementById('serviceGrid');
      const searchInput = document.getElementById('searchInput');
      const categoryFilter = document.getElementById('categoryFilter');

      function safeText(value) {
        return (value ?? '').toString();
      }

      function escapeHtml(value) {
        return safeText(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function statusLabel(status) {
        const map = {
          active: '在线',
          maintenance: '维护中',
          inactive: '停用',
          deprecated: '废弃'
        };
        return map[status] || '未知';
      }

      function renderServices(items) {
        if (!items.length) {
          serviceGrid.innerHTML = '<div class="empty">没有找到匹配的服务。</div>';
          return;
        }

        serviceGrid.innerHTML = items.map((item) => {
          const iconMarkup = item.iconSvg
            ? item.iconSvg
            : item.icon
              ? `<i class="${escapeHtml(item.icon)}"></i>`
              : '<i>◎</i>';

          const tags = (item.tags || []).slice(0, 4).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('');

          return `
            <article class="card">
              <div class="card-head">
                <div class="icon">${iconMarkup}</div>
                <h2 class="card-title">${escapeHtml(item.name)}</h2>
              </div>

              <p class="card-desc">${escapeHtml(item.description || '暂无简介')}</p>

              <div class="tags">${tags || '<span class="tag">未分类</span>'}</div>

              <div class="meta">
                <span class="meta-item"><span class="status ${escapeHtml(item.status || 'inactive')}"><span class="status-dot"></span>${statusLabel(item.status)}</span></span>
                <span class="meta-item">${escapeHtml(item.category || '其他')}</span>
              </div>
            </article>
          `;
        }).join('');
      }

      function filterServices(data) {
        const keyword = searchInput.value.trim().toLowerCase();
        const category = categoryFilter.value;

        return data.filter((item) => {
          const matchesKeyword = !keyword || [
            item.name,
            item.description,
            item.category,
            ...(item.tags || [])
          ].join(' ').toLowerCase().includes(keyword);

          const matchesCategory = category === 'all' || item.category === category;
          return matchesKeyword && matchesCategory;
        });
      }

      fetch('./services.json')
        .then((response) => response.json())
        .then((data) => {
          const all = Array.isArray(data.services) ? data.services : [];
          const update = () => renderServices(filterServices(all));
          searchInput.addEventListener('input', update);
          categoryFilter.addEventListener('change', update);
          update();
        })
        .catch(() => {
          serviceGrid.innerHTML = '<div class="empty">加载服务列表失败，请稍后再试。</div>';
        });
    </script>
  </body>
</html>
